name: Weekly review analysis

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC (09:00 in Türkiye)
  workflow_dispatch:
    inputs:
      source:
        description: "Which store to run"
        required: false
        default: "both"
        type: choice
        options: [both, google-play, app-store]

permissions:
  contents: write           # allows the workflow to commit results back

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python analyze_reviews.py ${{ inputs.source || 'both' }}

      - name: Commit results back to the repo
        run: |
          git config user.name "review-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data briefs
          git diff --staged --quiet || git commit -m "Review analysis $(date +%F)"
          git push
